services:
  core-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenuxs-core-api
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - MONGO_URL=mongodb://mongo:27017/zenuxs_core
      - REDIS_URL=redis://redis:6379
      - AUTH_JWKS_URL=http://auth:4001/.well-known/jwks.json
      - EVENTS_STREAM=zenuxs.events
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8081
      - NODE_ENV=development
      - LOG_LEVEL=info
      # Storage & Preferences
      - R2_ENDPOINT=http://minio:9000
      - R2_ACCESS_KEY_ID=minioadmin
      - R2_SECRET_ACCESS_KEY=minioadmin
      - R2_BUCKET=zenuxs-media
      - R2_PUBLIC_BASE_URL=http://localhost:9000/zenuxs-media
      - MAX_AVATAR_BYTES=5242880
      - MAX_BANNER_BYTES=10485760
      - SUPPORTED_LANGUAGES=en,hi,ta,te,ml,kn,bn,mr,gu,pa,ur
      - DEFAULT_LANGUAGE=en
      - INTERNAL_TOKEN=dev-internal-token
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth:
        condition: service_started
    restart: unless-stopped

  auth:
    image: node:20-alpine
    container_name: zenuxs-auth-mock
    working_dir: /app
    volumes:
      - ./scripts/mock-auth.js:/app/mock-auth.js:ro
      - ./package.json:/app/package.json:ro
    command: sh -c "npm install jose@^6.2.17 && node mock-auth.js"
    ports:
      - "4001:4001"
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: zenuxs-core-mongo
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zenuxs-core-redis
    ports:
      - "6389:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: zenuxs-media-minio
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: zenuxs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

volumes:
  mongo-data:
  redis-data:
  minio-data:
